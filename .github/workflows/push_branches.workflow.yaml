name: Push checks

# npm trusted publishing: this file name is the one registered as the trusted
# publisher of `vue-plugin-kuzzle` on npmjs.com. Renaming it, or publishing from
# another workflow, breaks the release. Every release branch (Vue 3 on master
# and beta, Vue 2 on 4-stable) publishes from this same file.
on:
  push:
    branches:
      - master
      - beta
      - 4-stable

jobs:
  release:
    name: Release process
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Trusted publishing needs npm >= 11.5.1, shipped with Node.js 24.
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Check
        run: npm test

      - name: Build plugin
        run: npm run build

      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.KUZZLE_BOT_APP_ID }}
          private-key: ${{ secrets.KUZZLE_BOT_PRIVATE_KEY }}

      - name: Release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          SEMANTIC_RELEASE_NPM_PUBLISH: "true"
          SEMANTIC_RELEASE_SLACK_WEBHOOK: ${{ secrets.SEMANTIC_RELEASE_SLACK_WEBHOOK }}
        run: npx semantic-release
